apiVersion: apps/v1
kind: Deployment
metadata:
  name: hola-gitops
  labels:
    app: hola-gitops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hola-gitops
  template:
    metadata:
      labels:
        app: hola-gitops
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
            - name: tmp
              mountPath: /tmp
      volumes:
        # Combina el HTML de la release (hola-html) con los datos del cliente (cliente-info)
        - name: html
          projected:
            sources:
              - configMap:
                  name: hola-html
              - configMap:
                  name: cliente-info
        - name: tmp
          emptyDir: {}
